<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>Uutisvahti</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0b1220;color:#eef2fa}body{margin:0}header{background:#101b32;padding:20px 16px;position:sticky;top:0;z-index:1;border-bottom:1px solid #29364c}h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#a7b4c9;font-size:13px}main{max-width:760px;margin:auto;padding:12px}nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0}button{background:#25334c;color:white;border:1px solid #40506a;border-radius:20px;padding:9px 13px;white-space:nowrap}button.active{background:#d8e6ff;color:#13203a}article{padding:16px 4px;border-bottom:1px solid #2c3850}article a{color:#f3f6ff;text-decoration:none;font-weight:650;font-size:17px;line-height:1.4}article a:visited{color:#aab6cc}.meta{font-size:12px;color:#a5b7d3;margin-bottom:7px}#status{font-size:13px;color:#abb8c9;padding:8px 0}input{width:100%;box-sizing:border-box;background:#19253a;border:1px solid #40506a;border-radius:10px;padding:12px;color:white;font-size:16px}</style></head><body>
<header><div style="max-width:760px;margin:auto"><h1>Uutisvahti</h1><p>Kaikki uutiset yhdessä paikassa</p></div></header><main><input id="search" type="search" placeholder="Hae otsikoista…"><nav id="filters"></nav><div id="status">Ladataan uutisia…</div><div id="news"></div></main>
<script>
const sources=['Kaikki','LaLiiga','Valioliiga','SuomiFutis','SuomiKiekko','Leijonat','NHLSuomi','SuomiKoris','SuomiUrheilu'];let selected='Kaikki',data=[];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelector('#filters').innerHTML=sources.map(s=>`<button class="${selected===s?'active':''}" data-site="${s}">${s}</button>`).join('');const q=document.querySelector('#search').value.toLocaleLowerCase('fi');const items=data.filter(x=>(selected==='Kaikki'||x.site===selected)&&x.title.toLocaleLowerCase('fi').includes(q));document.querySelector('#news').innerHTML=items.map(x=>`<article><div class="meta">${escapeHTML(x.site)} · ${x.timestamp?new Date(x.timestamp*1000).toLocaleString('fi-FI',{dateStyle:'short',timeStyle:'short'}):'Julkaisuaika tuntematon'}</div><a href="${escapeHTML(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(x.title)}</a></article>`).join('')||'<p>Ei uutisia näillä ehdoilla.</p>'}
document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.site){selected=e.target.dataset.site;render()}});document.querySelector('#search').addEventListener('input',render);
async function load(){try{const r=await fetch('news.json?'+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const obj=await r.json();data=obj.articles||[];const errors=Object.entries(obj.statuses||{}).filter(([,s])=>!s.ok).map(([n])=>n);document.querySelector('#status').textContent=`${data.length} artikkelia · Päivitetty ${new Date(obj.updated).toLocaleString('fi-FI')}${errors.length?' · Syöte ei toimi: '+errors.join(', '):''}`;render()}catch(e){document.querySelector('#status').textContent='Uutisia ei saatu ladattua. Tarkista, että automaattinen haku on käynnissä.'}}
load();setInterval(load,300000);
</script></body></html>
